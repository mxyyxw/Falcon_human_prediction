defaults:
  - /benchmark/nav/pointnav: pointnav_gibson
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat_baselines/rl/policy: streamvln
  - _self_

habitat_baselines:
  verbose: False
  trainer_name: "ddppo"
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  eval_ckpt_path_dir: "data/new_checkpoints"
  num_environments: 1
  checkpoint_folder: "data/new_checkpoints"
  num_updates: -1
  total_num_steps: 2.5e9
  log_interval: 10
  num_checkpoints: 10
  force_torch_single_threaded: True

  rl:
    policy:
      main_agent:
        name: "StreamVLNPolicy"
    ppo:
      clip_param: 0.2
      ppo_epoch: 2
      num_mini_batch: 1
      value_loss_coef: 0.0
      entropy_coef: 0.0
      lr: 1.0e-5
      eps: 1.0e-5
      max_grad_norm: 0.2
      num_steps: 128
      use_gae: False
      gamma: 0.0
      tau: 1.0
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 10
      use_normalized_advantage: False
